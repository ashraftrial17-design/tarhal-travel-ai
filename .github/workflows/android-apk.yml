name: Android APK Packaging & Distribution

on:
  push:
    branches: [ "Main", "stage-12-*" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rigorous APK Inspection & Verification
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi
          echo "=== APK File Metrics ==="
          ls -lh "$DEBUG_APK"
          sha256sum "$DEBUG_APK"

          echo "=== Locating Android Build-Tools ==="
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name zipalign | sort -V | tail -n 1)

          if [ -z "$AAPT" ] || [ -z "$APKSIGNER" ] || [ -z "$ZIPALIGN" ]; then
            echo "::error::Required Android SDK build-tools (aapt, apksigner, zipalign) not found."
            exit 1
          fi

          echo "=== AAPT Badging Inspection ==="
          $AAPT dump badging "$DEBUG_APK"

          echo "=== Zip Alignment Check ==="
          $ZIPALIGN -c -v 4 "$DEBUG_APK" || {
            echo "::error::Zip alignment check failed!"
            exit 1
          }

          echo "=== APKSIGNER Signature Verification ==="
          $APKSIGNER verify --verbose --print-certs "$DEBUG_APK" || {
            echo "::error::APK signature verification failed!"
            exit 1
          }

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarhal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarhal-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
