name: Android APK Packaging & Distribution

on:
  push:
    branches: [ "Main", "stage-12-installable-debug-apk" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Verify Debug APK Signature and Integrity
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "Error: Debug APK not found at $DEBUG_APK"
            exit 1
          fi
          echo "Debug APK found successfully."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | head -n 1)
          if [ -x "$APKSIGNER" ]; then
            echo "Verifying Debug APK signature with $APKSIGNER..."
            $APKSIGNER verify --verbose --print-certs "$DEBUG_APK"
          else
            echo "apksigner tool not found; skipping apksigner check."
          fi

      - name: Upload Installable Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarhal-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarhal-release-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
