name: Firebase Test Lab Launch Smoke Test

on:
  push:
    branches: [ "diagnostic/stage12-testlab-launch-smoke", "stage-12-*" ]
  pull_request:
    branches: [ "Main", "stage-12-*" ]
  workflow_dispatch:

jobs:
  testlab-launch:
    name: Firebase Test Lab Robo Launch Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Authenticate to Google Cloud / Firebase
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Firebase Test Lab Robo Test
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi

          echo "=== Setting GCP Project ==="
          gcloud config set project ${{ secrets.FIREBASE_PROJECT_ID }}

          echo "=== Executing Firebase Test Lab Robo Test ==="
          gcloud firebase test android run \
            --type robo \
            --app "$DEBUG_APK" \
            --device model=bluejay,version=33,locale=ar,orientation=portrait \
            --timeout 120s \
            --client-details matrixLabel="tarhal-stage12-startup-crash-diagnostic"
