name: Firebase Test Lab Startup Diagnostic

on:
  push:
    branches: [ "Main", "stage-12-*", "fix/*" ]
  pull_request:
    branches: [ "Main" ]
  workflow_dispatch:

jobs:
  test-lab:
    name: Firebase Test Lab Launch Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Verify Debug APK Existence
        run: |
          DEBUG_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$DEBUG_APK" ]; then
            echo "::error::Debug APK not found at $DEBUG_APK"
            exit 1
          fi
          echo "Debug APK successfully verified at $DEBUG_APK"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        continue-on-error: true
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        continue-on-error: true

      - name: Run Firebase Test Lab Robo Test
        id: test_lab
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "::warning::GCP_SA_KEY secret is not configured. Firebase Test Lab access is unavailable."
            echo "BLOCKED — Firebase Test Lab credentials/access unavailable"
            exit 1
          fi

          echo "=== Discovering available Android 13 (API 33) device models in Firebase Test Lab ==="
          gcloud firebase test android models list

          DEVICE_MODEL=$(gcloud firebase test android models list --format="json" | jq -r '[.[] | select(.supportedVersionIds[] | contains("33"))] | .[0].id // empty')
          if [ -z "$DEVICE_MODEL" ]; then
            DEVICE_MODEL="redfin"
          fi
          echo "Selected Device Model: $DEVICE_MODEL"

          gcloud firebase test android run \
            --type robo \
            --app app/build/outputs/apk/debug/app-debug.apk \
            --device model=$DEVICE_MODEL,version=33,locale=ar,orientation=landscape \
            --timeout 120s \
            --directories-to-pull /sdcard/ \
            --results-bucket=${{ secrets.GCP_TEST_LAB_BUCKET }}
